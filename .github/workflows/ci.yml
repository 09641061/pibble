# Same evidence as the local hooks: documentation rules, then every test including ArchitectureTest, then the image.
# Actions are pinned to a commit; the comment names its release.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: |
          for sha in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            scripts/check-commit-msg.sh "$RUNNER_TEMP/msg" || { echo "in commit $sha"; exit 1; }
          done
      - name: Check documentation
        run: scripts/check-docs.sh
      - name: Test
        run: ./mvnw -B test
      - name: Build the container image
        run: |
          ./mvnw -B package -DskipTests
          docker build -f src/main/docker/Dockerfile.jvm -t pibble:${{ github.sha }} .
