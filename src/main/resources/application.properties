# Dev and test use Quarkus Dev Services (PostgreSQL in Docker); prod reads the environment.
quarkus.application.name=pibble
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:pibble}
%prod.quarkus.datasource.username=${DATABASE_USER}
%prod.quarkus.datasource.password=${DATABASE_PASSWORD}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks the entities against it.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-migration-naming=true
quarkus.hibernate-orm.schema-management.strategy=validate
%dev.quarkus.hibernate-orm.log.sql=true

quarkus.smallrye-openapi.info-title=Pibble API
quarkus.swagger-ui.always-include=true
# Production serves neither the OpenAPI document nor Swagger UI: they list the /internal endpoints.
%prod.quarkus.swagger-ui.enabled=false
%prod.quarkus.smallrye-openapi.enabled=false

# Browsers may call the API only from the web app.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${takodu.app-url}

# Production logs one JSON object per line; logs never carry message bodies, phone numbers or tokens.
quarkus.log.console.json.enabled=false
%prod.quarkus.log.console.json.enabled=true

# On SIGTERM, requests get this long to finish; a job's open transaction rolls back and its row is claimed again.
%prod.quarkus.shutdown.timeout=20s

# Sign-in codes are emailed through Resend in prod; dev mode prints them to the console instead.
quarkus.rest-client.resend.url=https://api.resend.com
quarkus.rest-client.resend.connect-timeout=2000
quarkus.rest-client.resend.read-timeout=5000
%prod.takodu.email.from=${EMAIL_FROM}
%prod.takodu.email.resend-api-key=${RESEND_API_KEY}
# Invitation links point to the web app.
takodu.app-url=http://localhost:5173
%prod.takodu.app-url=${APP_URL}

# Access tokens (RS256). Dev and test generate a key pair at startup; prod reads the keys from files.
mp.jwt.verify.issuer=https://api.takodu.com
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION}
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION}

# O5: new organizations start with a trial; the Takodu team extends the plan after payment.
takodu.organization.trial-days=14

# Tests call jobs directly instead of waiting for their schedule.
%test.quarkus.scheduler.enabled=false

# WhatsApp through Meta's Cloud API (takodu-whatsapp). Dev and test use fakes; set TAKODU_META_ENABLED=true and the
# Meta variables to use Meta in dev. Business tokens are stored encrypted with takodu.token-key (AES-256-GCM).
takodu.meta.enabled=true
%dev.takodu.meta.enabled=${TAKODU_META_ENABLED:false}
%test.takodu.meta.enabled=false
takodu.meta.graph-version=v26.0
quarkus.rest-client.meta-graph.url=https://graph.facebook.com
quarkus.rest-client.meta-graph.connect-timeout=2000
quarkus.rest-client.meta-graph.read-timeout=10000
takodu.meta.app-id=${META_APP_ID:dev-app-id}
%prod.takodu.meta.app-id=${META_APP_ID}
takodu.meta.app-secret=${META_APP_SECRET:dev-app-secret}
%prod.takodu.meta.app-secret=${META_APP_SECRET}
takodu.meta.webhook-verify-token=${META_WEBHOOK_VERIFY_TOKEN:dev-verify-token}
%prod.takodu.meta.webhook-verify-token=${META_WEBHOOK_VERIFY_TOKEN}
takodu.token-key=${TOKEN_ENCRYPTION_KEY:ZGV2LW9ubHktdG9rZW4ta2V5LTMyLWJ5dGVzLWxvbmc=}
%prod.takodu.token-key=${TOKEN_ENCRYPTION_KEY}
# Customers' media, downloaded by MediaDownloader (07 §4). Production mounts a volume; dev and test use a temp dir.
takodu.media.dir=${java.io.tmpdir}/takodu-media
%prod.takodu.media.dir=${MEDIA_DIR}
# Files older than this are deleted by MediaRetentionJob; the message stays and shows the media as removed.
takodu.media.retention-days=${MEDIA_RETENTION_DAYS:90}
# Tests call jobs directly, so an after-commit wake-up never sends in the background behind their back.
%test.takodu.jobs.wake-ups=false

# The assistant's language model (takodu-assistant): any OpenAI-compatible provider, chosen by configuration only.
# Dev and test never call it; tests replace the chat model with a scripted one.
quarkus.langchain4j.openai.base-url=${LLM_BASE_URL:https://api.deepseek.com/v1}
quarkus.langchain4j.openai.api-key=${LLM_API_KEY:no-key-outside-prod}
quarkus.langchain4j.openai.chat-model.model-name=${LLM_MODEL:deepseek-chat}
quarkus.langchain4j.openai.chat-model.temperature=0.2
quarkus.langchain4j.openai.timeout=30s
quarkus.langchain4j.openai.max-retries=1
%prod.quarkus.langchain4j.openai.api-key=${LLM_API_KEY}
