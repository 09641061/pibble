# Dev and test use Quarkus Dev Services (PostgreSQL in Docker); prod reads the environment.
quarkus.application.name=pibble
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:pibble}
%prod.quarkus.datasource.username=${DATABASE_USER}
%prod.quarkus.datasource.password=${DATABASE_PASSWORD}

# Schema migrations are a proposed decision: docs/decisions/proposed/2026-10-19-schema-migrations.md
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%prod.quarkus.hibernate-orm.schema-management.strategy=none
%dev.quarkus.hibernate-orm.log.sql=true

quarkus.smallrye-openapi.info-title=Pibble API
quarkus.swagger-ui.always-include=true
